<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAUDIO AFB - Xác nhận email</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #071014;
      color: #e7f6f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      background: #0b171c;
      border: 1px solid #20e0d8;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 28px rgba(32, 224, 216, 0.12);
    }

    .brand {
      color: #20e0d8;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 25px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: #c8dadd;
      font-size: 16px;
      line-height: 1.7;
    }

    .note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #233238;
      color: #8da5aa;
      font-size: 13px;
    }

    .success {
      color: #20e0d8;
    }

    .error {
      color: #ffb020;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">NAUDIO AFB UNIVERSAL</div>

    <h1 id="title">ĐANG KIỂM TRA...</h1>

    <p id="message">
      Vui lòng chờ trong giây lát.
    </p>

    <div class="note">
      Sau khi xác nhận, hãy quay lại ứng dụng NAUDIO AFB để đăng nhập.
    </div>
  </div>

  <script>
    const query = new URLSearchParams(window.location.search);

    const hashText = window.location.hash.startsWith("#")
      ? window.location.hash.substring(1)
      : window.location.hash;

    const hash = new URLSearchParams(hashText);

    const error =
      query.get("error_description") ||
      query.get("error") ||
      hash.get("error_description") ||
      hash.get("error");

    const accessToken = hash.get("access_token");
    const code = query.get("code");

    const type =
      hash.get("type") ||
      query.get("type");

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (error) {
      title.textContent = "XÁC NHẬN EMAIL KHÔNG THÀNH CÔNG";
      title.className = "error";

      message.textContent =
        "Liên kết xác nhận không hợp lệ hoặc đã hết hạn. Vui lòng quay lại NAUDIO AFB và thực hiện lại.";
    }
    else if (accessToken || code || type === "signup") {
      title.textContent = "XÁC NHẬN EMAIL THÀNH CÔNG";
      title.className = "success";

      message.innerHTML =
        "Email của bạn đã được xác nhận.<br>" +
        "Bạn có thể quay lại NAUDIO AFB và đăng nhập.<br><br>" +
        "Nếu ứng dụng chưa nhận ngay, vui lòng chờ một ít phút rồi thử lại.";
    }
    else {
      title.textContent = "YÊU CẦU ĐÃ ĐƯỢC XỬ LÝ";
      title.className = "success";

      message.innerHTML =
        "Bạn có thể quay lại NAUDIO AFB và thử đăng nhập.<br>" +
        "Nếu vừa xác nhận email, hệ thống có thể cần một ít thời gian để đồng bộ.";
    }
  </script>
</body>
</html>
