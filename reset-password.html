<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NAUDIO AFB - Đặt lại mật khẩu</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #071014;
      color: #e7f6f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 30px 24px;
      background: #0b171c;
      border: 1px solid #20e0d8;
      border-radius: 16px;
      box-shadow: 0 0 28px rgba(32,224,216,.12);
    }

    .brand {
      color: #20e0d8;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    h1 {
      text-align: center;
      color: #20e0d8;
      font-size: 25px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #c8dadd;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #071014;
      border: 1px solid #40545a;
      border-radius: 7px;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 1px solid #20e0d8;
      border-radius: 7px;
      background: #0b171c;
      color: #20e0d8;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
    }

    .ok { color: #20e0d8; }
    .error { color: #ffb020; }

    .note {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid #233238;
      text-align: center;
      color: #8da5aa;
      font-size: 13px;
    }
  </style>
</head>

<body>
<div class="card">

  <div class="brand">NAUDIO AFB UNIVERSAL</div>

  <h1>ĐẶT LẠI MẬT KHẨU</h1>

  <label>Mật khẩu mới</label>
  <input id="password1" type="password"
         minlength="8"
         autocomplete="new-password">

  <label>Nhập lại mật khẩu mới</label>
  <input id="password2" type="password"
         minlength="8"
         autocomplete="new-password">

  <button id="btn" disabled>ĐỔI MẬT KHẨU</button>

  <div id="status">
    Đang kiểm tra liên kết đặt lại mật khẩu...
  </div>

  <div class="note">
    Mật khẩu phải có tối thiểu 8 ký tự.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://wflpchaophmelkyktsel.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_I1w3wYHJYGqSVtQ_ylz2jQ_Ma8YxzJh";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  }
);

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");

function show(text, ok = false) {
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "error";
}

async function initializeRecovery() {
  const query = new URLSearchParams(location.search);

  const hashText = location.hash.startsWith("#")
    ? location.hash.substring(1)
    : location.hash;

  const hash = new URLSearchParams(hashText);

  const error =
    query.get("error_description") ||
    query.get("error") ||
    hash.get("error_description") ||
    hash.get("error");

  if (error) {
    show("Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.");
    return;
  }

  const accessToken = hash.get("access_token");
  const refreshToken = hash.get("refresh_token");

  if (!accessToken || !refreshToken) {
    show("Không tìm thấy phiên đặt lại mật khẩu hợp lệ.");
    return;
  }

  const { error: sessionError } =
    await client.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    });

  if (sessionError) {
    show("Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.");
    return;
  }

  history.replaceState(null, "", location.pathname);

  statusEl.textContent =
    "Liên kết hợp lệ. Hãy nhập mật khẩu mới.";
  statusEl.className = "ok";

  btn.disabled = false;
}

btn.addEventListener("click", async () => {

  const p1 =
    document.getElementById("password1").value;

  const p2 =
    document.getElementById("password2").value;

  if (p1.length < 8) {
    show("Mật khẩu phải có tối thiểu 8 ký tự.");
    return;
  }

  if (p1 !== p2) {
    show("Hai mật khẩu không giống nhau.");
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "Đang cập nhật mật khẩu...";
  statusEl.className = "";

  const { error } =
    await client.auth.updateUser({
      password: p1
    });

  if (error) {
    show("Không thể đổi mật khẩu. Vui lòng yêu cầu email mới và thử lại.");
    btn.disabled = false;
    return;
  }

  show("ĐỔI MẬT KHẨU THÀNH CÔNG. Bạn có thể quay lại NAUDIO AFB và đăng nhập.", true);

  document.getElementById("password1").value = "";
  document.getElementById("password2").value = "";
});

initializeRecovery();
</script>

</body>
</html>
